name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      # VITE_* values are public; set them as repository variables (Settings > Secrets and variables > Actions > Variables).
      VITE_DB_PROVIDER: ${{ vars.VITE_DB_PROVIDER }}
      VITE_SHEETS_API_URL: ${{ vars.VITE_SHEETS_API_URL }}
      VITE_IDENTITY_API_URL: ${{ vars.VITE_IDENTITY_API_URL }}
      VITE_EXPENSE_API_URL: ${{ vars.VITE_EXPENSE_API_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fail before publishing a demo that would only show a configuration error.
      - name: Check required variables
        run: |
          missing=0
          require() { if [ -z "${!1}" ]; then echo "::error::Repository variable $1 is not set"; missing=1; fi; }
          require VITE_DB_PROVIDER
          require VITE_GOOGLE_CLIENT_ID
          if [ "$VITE_DB_PROVIDER" = "sheets" ]; then
            require VITE_SHEETS_API_URL
            require VITE_IDENTITY_API_URL
            require VITE_EXPENSE_API_URL
          else
            require VITE_SUPABASE_URL
            require VITE_SUPABASE_ANON_KEY
          fi
          exit $missing
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # A custom domain serves the site at '/'; without one Pages serves under /<repo>/.
          # Set the repository variable VITE_BASE_PATH to /<repo>/ only for the github.io URL.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
